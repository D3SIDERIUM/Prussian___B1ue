<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메모장</title>
  <style>
    @font-face {
  font-family: 'Escoredream';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-8Heavy.woff') format('woff');
  font-weight: 800;
  font-display: swap;
}

@font-face {
  font-family: 'Escoredream';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-4Regular.woff') format('woff');
  font-weight: normal;
  font-display: swap;
}
    /* ────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
    /* ────────────────────────── */
      --side: clamp(16px, 8vw, 56px);
      --gap:  clamp(16px, 7vw, 32px);

      --bar:   #e9e9e9;
      --paper: #fafafa;
      --line:  #e0e0e0; 
      --sub:   #5f5f5f;
      --blue:  #0067c0;
    }

    body {
      font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
      background: #dfe7f2;
      color: #1b1b1b;
      line-height: 1.2;
    }

    /* ────────────────────────── */
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--gap) var(--side);
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    /* ────────────────────────── */
    .win {
      background: var(--paper);
      border: 1px solid #c9c9c9;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .18);
    }

    /* ────────────────────────── */
    .tabs {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 40px;
      padding-left: 10px;
      background: var(--bar);
    }
    .tab-list {
      display: flex;
      align-items: flex-end;
      height: 100%;
      min-width: 0;
      overflow: hidden;
      padding-top: 6px;
    }
    .tab {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      width: clamp(96px, 22vw, 190px);
      height: 100%;
      min-width: 0;
      padding: 0 12px;
      border: 0;
      border-radius: 8px 8px 0 0;
      background: none;
      font: inherit;
      font-size: .82rem;
      color: #333;
      cursor: pointer;
    }
    .tab span {
      flex: 1;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab em {
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7a7a7a;
    }
    .tab[aria-selected="true"] { background: var(--paper); }
    .tab:hover:not([aria-selected="true"]) { background: #f1f1f1; }

    .tab + .tab:not([aria-selected="true"])::before {
      content: "";
      position: absolute;
      left: 0;
      top: 25%;
      height: 50%;
      border-left: 1px solid #c8c8c8;
    }

    .tab-add {
      display: grid;
      place-items: center;
      width: 36px;
      height: 100%;
      font-size: 1.1rem;
      color: #444;
    }

    .controls {
      display: flex;
      align-self: flex-start;
      height: 32px;
      color: #444;
    }
    .controls i {
      display: grid;
      place-items: center;
      width: 46px;
      font-style: normal;
      font-size: .85rem;
    }
    .controls i:hover { background: #dcdcdc; }
    .controls i:last-child:hover { background: #c42b1c; color: #fff; }

    /* ────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 37px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      font-size: .9rem;
    }
    .toolbar u {
      text-decoration: none;
      padding: 3px 10px;
      border-radius: 4px;
    }
    .toolbar u:hover { background: #ececec; }

    .menu   { display: flex; gap: 2px; }
    .format { display: flex; align-items: center; gap: 2px; margin: 0 auto; color: #333; }
    .format u { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; }
    .format .chevron { flex: none; }
    .right  { display: flex; align-items: center; gap: 4px; }
    .right svg { display: block; }

    .has-badge { position: relative; }
    .has-badge::after {
      content: "";
      position: absolute;
      top: 0;
      right: 2px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
    }

    /* ────────────────────────── */
    .doc { display: none; padding: clamp(14px, 4vw, 22px); }
    .doc.on { display: block; }
.doc h1 {
  font-family: 'Escoredream', "Malgun Gothic", sans-serif;
  font-size: clamp(1.3rem, 5vw, 2rem);
  font-weight: 800; 
}
.doc p {
  font-family: 'Escoredream', "Malgun Gothic", sans-serif;
  font-weight: normal;
  color: var(--sub);
}
.doc p.note {
  width: 100%;
  margin-top: 6px;
  color: #292929;
  line-height: 1.7;
}
.fnr {
  color: #0070d1;
  font-size: 11px;
  font-family: 'Escoredream', "Malgun Gothic", sans-serif;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  vertical-align: super;
  line-height: 0;
  position: relative;
  top: -1px;
}
.fnp {
  position: absolute;
  background: #fff;
  color: #000;
  padding: 10px 13px;
  border: 1px solid #e2e2e2;
  border-radius: 8px;
  font-size: 13px;
  font-family: 'Escoredream', "Malgun Gothic", sans-serif;
  font-weight: normal;
  line-height: 1.5;
  width: max-content;
  max-width: min(300px, 85vw);
  box-sizing: border-box;
  text-align: left;
  z-index: 9999;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
  word-break: keep-all;
  overflow-wrap: break-word;
  text-wrap: balance;
  display: none;
}
.fn .fnp { display: none !important; }
.doc.side.on {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 4px 24px;
}
.doc.side p {
  display: grid;
  grid-template-columns: repeat(2, auto);
  column-gap: 1.5em;
}
    #hero .doc { min-height: clamp(70px, 18vw, 130px); }
    #main .doc { min-height: clamp(170px, 46vw, 300px); }

    /* ────────────────────────── */
    .status {
      display: flex;
      align-items: center;
      height: 34px;
      border-top: 1px solid var(--line);
      font-size: .75rem;
      color: var(--sub);
    }
    .status span {
      padding: 0 16px;
      border-left: 1px solid var(--line);
      white-space: nowrap;
    }
    .status .pos,
    .status .count { border: 0; }
    .status .count { margin-right: auto; }

    /* ────────────────────────── */
    @media (max-width: 700px) {
      .page { min-height: 100dvh; padding: 10px 12px; gap: 10px; }
      .win  { box-shadow: 0 4px 12px rgba(0, 0, 0, .12); }

      #main { flex: 1; display: flex; flex-direction: column; }
      #main .doc.on { flex: 1; }
      #hero .doc, #main .doc { min-height: 0; }

      .format, .status .extra, .controls { display: none; }

      .tab-list { flex: 1; overflow-x: auto; scrollbar-width: none; }
      .tab-list::-webkit-scrollbar { display: none; }
      .tab {
        flex: 0 1 auto;
        width: 72px;
        min-width: 48px;
        padding: 0 8px;
        transition: width .1s ease-out, padding .1s ease-out;
      }
      .tab em {
        width: 0;
        margin-left: -8px;
        opacity: 0;
        transition: width .1s ease-out, margin-left .1s ease-out, opacity .1s ease-out;
      }
      .tab[aria-selected="true"] { flex-shrink: 0; width: 120px; padding: 0 12px; }
      .tab[aria-selected="true"] em { width: 7px; margin-left: 0; opacity: 1; }
      .tab-add { flex: none; }

    /* ────────────────────────── */
      .right { margin-left: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tab, .tab em { transition: none; }
    }
  </style>
</head>

<body>
  <main class="page" id="page">
  </main>

  <script>
    /* ────────────────────────── */
    const fn = (mark, content) =>
  `<span class="fn"><span class="fnr">${mark}</span><span class="fnp">${content}</span></span>`;
    const windows = [
      {
        id: "hero",
        tabs: [
          { name: "崩坏3", title: "Honkai Impact 3rd", text: "Canon x OC", note: "</br><i>May all the beauty be blessed!</i>"},
          { name: "About Me", title: "쥐치", items: ["성인", "여성", "NCP", "극온리"], note: "</br>HoYoverse의 각종 논란을 인지하고 있으며 절대 옹호하지 않습니다." }
        ]
      },
      {
        id: "main",
        tabs: [
          { name: "NG", title: "이하 이유 불문 블락", text: "재연결 X", note: "</br>클라이언트 변조 요소 (리)트윗</br>엘리시아 CP, 겹드림</br>엘리시아=키레네 동일인 취급</br>플레이어블 출시 예정 캐릭터 드림</br>드림캐 무기 명함 선택 보유(종결x)</br>남초 커뮤니티 드립"  },
          
          { name: "Warning", title: "⚠",     text: " ", note: "</br>HoYoverse 쉐도우 복싱" + fn("[1]", "업데이트, (온)오프라인 행사, 스타시스템, 유출 ") + "多" + "</br>키레네 드림은 연결이 어렵습니다.</br>제 드림을 CP로 치환하지 마세요!!!"},
          { name: "List", title: "1T1D",     text: "리스트 추가는 DM 주세요", note: "</br>崩坏3&nbsp;&nbsp;레일라</br>銀魂&nbsp;&nbsp; 사카타 긴토키</br>文スト&nbsp;&nbsp;나카하라 츄야</br>ツイステ&nbsp;&nbsp;플로이드 리치" }
        ]
      }
    ];

    /* ────────────────────────── */
    const svg = (paths) =>
      `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;

    const ICON = {
      notepad: `<svg width="16" height="16" viewBox="0 0 16 16">
                  <rect x="3" y="1" width="10" height="14" rx="2" fill="#2aa0d8"/>
                  <path d="M5 5h6M5 8h6M5 11h4" stroke="#fff" stroke-width="1.2"/>
                </svg>`,
      chevron: `<svg class="chevron" width="10" height="10" viewBox="0 0 10 10" fill="none"
                     stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 3.5l3 3 3-3"/>
                </svg>`,
      megaphone: svg('<path d="M3 10v4h3l8 4V6L6 10H3zM18 9a4 4 0 010 6"/>'),
      gear:      svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>')
    };

    /* ────────────────────────── */
    const tabsHTML = (tabs) => `
      <div class="tabs">
        <div class="tab-list">
          ${tabs.map(t => `
            <button class="tab" aria-selected="false">
              ${ICON.notepad}<span>${t.name}</span><em></em>
            </button>`).join("")}
          <div class="tab-add">+</div>
        </div>
        <div class="controls"><i>—</i><i>☐</i><i>✕</i></div>
      </div>`;

    const toolbarHTML = `
      <div class="toolbar">
        <div class="menu"><u>파일</u><u>편집</u><u>보기</u></div>
        <div class="format">
          <u>H1 ${ICON.chevron}</u><u>☰ ${ICON.chevron}</u><u><b>B</b></u><u><i>I</i></u><u><s>S</s></u><u>🔗︎</u><u>⋯</u>
        </div>
        <div class="right">
          <u class="has-badge">${ICON.megaphone}</u><u>${ICON.gear}</u>
        </div>
      </div>`;
const noteHTML = (t) => t.note ? `<p class="note">${t.note}</p>` : "";
const docsHTML = (tabs) => tabs.map(t => t.items
  ? `<div class="doc side"><h1>${t.title}</h1><p>${t.items.map(i => `<span>${i}</span>`).join("")}</p>${noteHTML(t)}</div>`
  : `<div class="doc"><h1>${t.title}</h1><p>${t.text}</p>${noteHTML(t)}</div>`).join("");
  
    const statusHTML = `
      <div class="status">
        <span class="pos"></span>
        <span class="count"></span>
        <span class="extra">일반 텍스트</span>
        <span class="extra">100%</span>
        <span class="extra">Windows (CRLF)</span>
        <span>UTF-8</span>
      </div>`;

    /* ────────────────────────── */
    function createWindow(config) {
      const win = document.createElement("section");
      win.className = "win";
      win.id = config.id;
      win.innerHTML = tabsHTML(config.tabs) + toolbarHTML + docsHTML(config.tabs) + statusHTML;

      const tabs  = win.querySelectorAll(".tab");
      const docs  = win.querySelectorAll(".doc");
      const pos   = win.querySelector(".pos");
      const count = win.querySelector(".count");

      function selectTab(index) {
        tabs.forEach((tab, i) => tab.setAttribute("aria-selected", i === index));
        docs.forEach((doc, i) => doc.classList.toggle("on", i === index));

        const clone = docs[index].cloneNode(true);
clone.querySelectorAll(".fn").forEach((n) => n.remove());
const length = clone.textContent.length;

        pos.textContent   = `줄 1, 열 ${length + 1}`;
        count.textContent = `${length}자`;
      }

      tabs.forEach((tab, i) => tab.addEventListener("click", () => selectTab(i)));
      selectTab(0);
      return win;
    }
const popup = document.createElement("div");
popup.className = "fnp";
document.body.appendChild(popup);

function fitWidth(el) {
  el.style.width = "";
  const range = document.createRange();
  range.selectNodeContents(el);
  const rects = range.getClientRects();
  let minL = Infinity, maxR = -Infinity;
  for (const r of rects) {
    if (r.width === 0) continue;
    minL = Math.min(minL, r.left);
    maxR = Math.max(maxR, r.right);
  }
  if (minL === Infinity) return;
  const cs = getComputedStyle(el);
  const extra = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
              + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
  el.style.width = Math.ceil(maxR - minL + extra) + 1 + "px";
}

function showPopup(source, trigger) {
  popup.innerHTML = source.innerHTML;
  popup._source = source;
  popup.style.display = "block";
  popup.style.position = "fixed";
  popup.style.bottom = "auto";
  popup.style.transform = "none";
  fitWidth(popup);

  const r = trigger.getBoundingClientRect();
  const pw = popup.offsetWidth, ph = popup.offsetHeight, m = 8;
  let left = r.left + r.width / 2 - pw / 2;
  let top = r.top - ph - m;

  if (left < m) left = m;
  if (left + pw > window.innerWidth - m) left = window.innerWidth - m - pw;
  if (top < m) top = r.bottom + m;

  popup.style.left = left + "px";
  popup.style.top = top + "px";
}

function hidePopup() {
  popup.style.display = "none";
  popup._source = null;
}

document.addEventListener("click", (e) => {
  const ref = e.target.closest(".fnr");
  if (!ref) { hidePopup(); return; }
  const source = ref.parentElement.querySelector(".fnp");
  const isOpen = popup.style.display === "block" && popup._source === source;
  hidePopup();
  if (!isOpen) showPopup(source, ref);
  e.stopPropagation();
});

document.addEventListener("mouseover", (e) => {
  const ref = e.target.closest(".fnr");
  if (ref && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
    showPopup(ref.parentElement.querySelector(".fnp"), ref);
  }
});
document.addEventListener("mouseout", (e) => {
  if (e.target.closest(".fnr")) hidePopup();
});

window.addEventListener("scroll", hidePopup, { passive: true });
document.addEventListener("touchmove", hidePopup, { passive: true });
    const page = document.getElementById("page");
    windows.forEach(config => page.appendChild(createWindow(config)));
  </script>
</body>
</html>
